services:
  bot:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npm start
    environment:
      - BASE44_PREVIEW_MODE
      - STATUS_PORT=3000
      - FAQ_FILE=/data/faq-data.json
      - CONFIG_FILE=/data/faq-config.json
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/app
      - bot-data:/data
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      base44.project: "Discord FAQ Bot"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  bot-data:

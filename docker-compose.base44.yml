services:
  bot:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npx nodemon --watch 系統 --watch server.js --signal SIGTERM server.js
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
